[project]
name = "labsagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shehryars715", email = "shehryar0707@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.13",
    # Only used when a lab says to download its data from Kaggle. The
    # import is guarded anyway (see data/sources.py), so a stripped
    # install still runs -- a Kaggle reference just fails with a
    # sentence instead of a file.
    "kagglehub>=1.0.2",
    "langchain-deepseek>=1.1.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
labsagent = "labsagent.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# WHY THIS IS PINNED. pytest's default `python_files` is `test_*.py *_test.py`,
# so without this it walks the whole repo and imports anything matching --
# including `web/smoke_test.py` and `web/matrix_test.py`, neither of which
# contains a unit test. Importing them is not free: a module-level error in a
# collected file does not skip that file, it prints "Interrupted: N errors
# during collection" and you lose the entire suite.
#
# Both live-test scripts are written to be import-safe anyway. This is the
# second guard, and the one that does not depend on anyone remembering.
testpaths = ["tests"]
